<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menú de La Baristería</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
:root{--bg:#0E1F1C;--surface:#16302B;--surface2:#1F3D37;--ink:#FFF6EA;--muted:rgba(255,246,234,.68);--mint:#5FE3C8;--orange:#FF7A45;--amber:#FFB547;--disp:'Cormorant Garamond',Georgia,serif;--bd:'Jost','Helvetica Neue',Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:#050c0b;color:var(--ink);font-family:var(--bd);font-size:15px;line-height:1.45}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
h1,h2,h3,p{margin:0}
#app{max-width:430px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);position:relative;overflow-x:hidden}
.scr{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:18px;padding:calc(52px + env(safe-area-inset-top,0px)) 18px calc(120px + env(safe-area-inset-bottom,0px))}
.beans{position:absolute;left:0;right:0;top:300px;bottom:0;overflow:hidden;pointer-events:none;z-index:0}
.bean{position:absolute;top:-60px;opacity:0;animation:fall linear infinite}
@keyframes fall{0%{transform:translate3d(0,0,0) rotate(0);opacity:0}10%{opacity:.26}50%{transform:translate3d(14px,260px,0) rotate(170deg);opacity:.26}90%{opacity:.26}100%{transform:translate3d(-10px,520px,0) rotate(360deg);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes barup{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.rise{animation:rise .5s cubic-bezier(.16,1,.3,1) backwards}
.glass{background:var(--surface);border:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1}
.logo{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none}
.m{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 2px var(--mint)}
.logo b{font-family:var(--disp);font-weight:500;font-size:22px}
.icon{display:flex;align-items:center;justify-content:center;width:52px;height:44px;border-radius:20px;color:var(--ink);background:var(--surface);border:0}
.title{font-family:var(--disp);font-style:italic;font-weight:500;font-size:40px;line-height:1;position:relative;z-index:1}
.sub{font-size:14px;font-weight:300;color:var(--muted);position:relative;z-index:1}
.offer{position:relative;z-index:1;display:flex;flex-direction:column;gap:3px;padding:14px 16px;border-radius:20px;background:linear-gradient(135deg,var(--orange),#E8622E);color:#0E1F1C;border:0;text-align:left;width:100%}
.offer small{font-size:10px;letter-spacing:.22em;text-transform:uppercase;opacity:.8}
.offer b{font-family:var(--disp);font-style:italic;font-weight:500;font-size:22px;line-height:1.05}
.grid2{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sechdr{position:relative;z-index:1;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sechdr b{font-family:var(--disp);font-style:italic;font-weight:500;font-size:24px}
.sechdr span{font-size:12px;color:var(--muted);text-align:right}
.tile{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;height:146px;padding:14px 15px;border-radius:24px;border:0;color:#0E1F1C;text-align:left}
.tile .ph{display:flex;align-items:center;justify-content:center;align-self:flex-end;width:52px;height:52px;border-radius:50%;background:rgba(14,31,28,.16);overflow:hidden}
.tile .ph img{width:100%;height:100%;object-fit:cover}
.tile b{font-family:var(--disp);font-weight:500;font-size:22px;line-height:1}
.tile .n{font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.75}
.chips{position:relative;z-index:1;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:38px;padding:0 14px;border-radius:19px;border:0;font-size:12.5px;letter-spacing:.05em;white-space:nowrap;background:var(--surface);color:var(--ink)}
.sec{position:relative;z-index:1;display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-top:4px}
.sec::after{content:"";flex:1 1 auto;height:1px;background:rgba(255,246,234,.14)}
.list{position:relative;z-index:1;display:flex;flex-direction:column;gap:10px}
.card{display:flex;flex-direction:column;padding:10px;border-radius:22px}
.itop{display:flex;gap:12px;align-items:center}
.ph{display:flex;align-items:center;justify-content:center;flex:0 0 auto;width:78px;height:78px;border-radius:16px;color:#0E1F1C;overflow:hidden;font-family:var(--disp);font-size:30px}
.ph img{width:100%;height:100%;object-fit:cover}
.info{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:4px;text-align:left}
.info b{font-size:15px;font-weight:500}
.info p{font-size:12.5px;font-weight:300;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{display:flex;align-items:center;gap:8px}
.pr .price{font-size:14px;font-weight:500;color:var(--amber)}
.badge{font-size:10px;letter-spacing:.16em;text-transform:uppercase;padding:4px 9px;border-radius:999px;color:#0E1F1C}
.open{flex:1 1 auto;min-width:0;display:flex;gap:12px;align-items:center;background:transparent;border:0;color:var(--ink);padding:0;text-align:left}
.add{display:flex;align-items:center;justify-content:center;flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:0;background:var(--surface2);color:var(--ink)}
.step{display:flex;align-items:center;gap:2px;flex:0 0 auto;padding:3px;border-radius:999px;background:var(--mint)}
.step button{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:#0E1F1C}
.step .q{min-width:18px;text-align:center;font-weight:500;color:#0E1F1C}
.det{display:flex;flex-direction:column;gap:12px;padding:12px 2px 4px}
.detph{width:100%;height:190px;border-radius:18px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#0E1F1C;font-family:var(--disp);font-size:66px;line-height:1}
.detph img{width:100%;height:100%;object-fit:cover}
.optg{display:flex;flex-direction:column;gap:8px}
.optg .lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mint)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{height:42px;padding:0 14px;border-radius:21px;border:0;font-size:13px;background:var(--surface2);color:var(--ink)}
.opt.on{background:var(--mint);color:#0E1F1C;font-weight:500}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:27px;border:0;background:var(--mint);color:#0E1F1C;font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;width:100%;text-decoration:none}
.welcome{padding:0 0 calc(8px + env(safe-area-inset-bottom,0px));gap:0;min-height:100vh;min-height:100dvh}
.whero{position:relative;flex:0 0 auto;height:clamp(330px,50vh,430px);display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 30%,#5FE3C8 0%,#3F9A8A 28%,#1E4A42 75%,#0E1F1C 100%)}
.wheroimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 45%}
.whero .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,31,28,.3) 0%,rgba(14,31,28,0) 28%,rgba(14,31,28,0) 50%,rgba(14,31,28,.85) 82%,#0E1F1C 100%)}
.wtopbar{position:absolute;left:18px;right:18px;top:calc(28px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;z-index:2}
.wchip{display:flex;align-items:center;height:36px;padding:0 14px;border-radius:18px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink);background:var(--surface)}
.welcome .beans{top:400px}
.wcol{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:-96px;padding:0 28px;text-align:center}
.wbadge{display:flex;align-items:center;justify-content:center;width:104px;height:104px;border-radius:50%;background:#FFF6EA;box-shadow:0 0 0 4px #0E1F1C,0 0 0 6px var(--mint),0 18px 40px rgba(0,0,0,.45)}
.wname2{margin:6px 0 0;font-family:var(--disp);font-weight:500;font-size:40px;line-height:1;color:var(--ink)}
.wsub2{margin:0;font-size:15px;color:var(--mint)}
.wtag2{margin:6px 0 0;max-width:280px;font-family:var(--disp);font-style:italic;font-weight:500;font-size:20px;line-height:1.35;color:rgba(255,246,234,.72)}
.wbot{position:relative;z-index:1;display:flex;flex-direction:column;gap:12px;margin-top:auto;padding:0 18px 28px}
.wmenu{display:flex;align-items:center;justify-content:center;gap:12px;height:58px;border-radius:29px;background:var(--mint);color:#0E1F1C;border:0;font-size:14px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;width:100%}
.whours{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.whours .hc{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:20px}
.whours .hc .t{font-size:14px;color:var(--ink)}
.whours .hc .n{font-size:11px;font-weight:300;color:rgba(255,246,234,.6)}
.bigct{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;align-self:center;width:260px;height:80px;border-radius:40px;border:0;background:#7A4B32;color:var(--ink);text-decoration:none;position:relative;z-index:1}
.bigct span{font-size:14px;font-weight:500;letter-spacing:.03em;text-align:center}
.lines{position:relative;z-index:1;display:flex;flex-direction:column;gap:10px}
.cl{display:flex;gap:12px;align-items:center;padding:10px;border-radius:22px}
.cl .ph{width:52px;height:52px;border-radius:14px}
.cl .ci{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.cl .ci b{font-size:14.5px;font-weight:500}
.cl .ci .o{font-size:12px;font-weight:300;color:var(--muted)}
.cl .ci .t{font-size:13px;font-weight:500;color:var(--amber)}
.form{position:relative;z-index:1;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:24px}
.seg{display:flex;gap:8px}
.seg button{flex:1;height:44px;border-radius:22px;border:0;font-size:13px;letter-spacing:.06em;background:var(--surface2);color:var(--ink)}
.seg button.on{background:var(--mint);color:#0E1F1C;font-weight:500}
.lbl2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mint)}
.in{width:100%;box-sizing:border-box;height:48px;padding:0 16px;border-radius:14px;border:0;background:#0A1816;box-shadow:inset 0 0 0 1px rgba(255,246,234,.22);color:var(--ink);font-size:16px}
.in::placeholder{color:rgba(255,246,234,.5)}
.note{font-size:12px;font-weight:300;color:var(--muted);line-height:1.5}
.tot{position:relative;z-index:1;display:flex;flex-direction:column;gap:6px;padding:0 4px}
.tot .r{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.tot .r.big{font-size:20px;font-weight:500;color:var(--ink)}
.tot .r.big b{color:var(--amber);font-weight:500}
.prev{position:relative;z-index:1;display:flex;flex-direction:column;gap:8px}
.prev .lbl2{color:var(--muted)}
.bubble{padding:14px 16px;border-radius:18px 18px 18px 4px;background:#1C3B35;font-size:13px;line-height:1.55;white-space:pre-line}
.signup{position:relative;z-index:1;display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:24px}
.signup b{font-family:var(--disp);font-style:italic;font-weight:500;font-size:24px}
.signup .cs{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--muted)}
.signup .cs input{margin-top:2px;width:18px;height:18px;flex:0 0 auto;accent-color:var(--mint)}
.smsg{font-size:13px;min-height:16px}.smsg.ok{color:var(--mint)}.smsg.bad{color:#FF8A7A}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));width:min(394px,calc(100% - 36px));display:flex;align-items:center;justify-content:space-between;gap:12px;height:60px;padding:0 8px 0 20px;border-radius:30px;border:0;background:var(--mint);color:#0E1F1C;z-index:5;animation:barup .4s cubic-bezier(.16,1,.3,1)}
.bar .bl{display:flex;flex-direction:column;align-items:flex-start}
.bar .bl small{font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.75}
.bar .bl b{font-size:15px;font-weight:500}
.bar .go{display:flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:22px;background:#0E1F1C;color:var(--ink);font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
.center{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:40px 28px}
.center .m{width:72px;height:72px}
.center h2{font-family:var(--disp);font-style:italic;font-weight:500;font-size:30px}
.center p{color:var(--muted);font-size:14px;max-width:34ch}
@media (prefers-reduced-motion:reduce){.bean{display:none}.rise,.bar{animation:none}}
</style>
</head>
<body>
<div id="app"><div class="center"><span class="m"></span><p>Cargando el menú…</p></div></div>
<script>
const LOGO='<svg viewBox="0 0 96 96" width="26" height="26" fill="none" aria-hidden="true"><ellipse cx="48" cy="50" rx="13" ry="19" transform="rotate(-24 48 50)" stroke="#5A3A28" stroke-width="3"/><path d="M42 34 C52 43 44 57 54 66" stroke="#5A3A28" stroke-width="3" stroke-linecap="round"/><path d="M30 30 C30 20 38 16 44 18 C42 26 38 30 30 30 Z" fill="#5FE3C8"/><path d="M66 30 C66 20 58 16 52 18 C54 26 58 30 66 30 Z" fill="#5FE3C8"/></svg>';
const BEAN='<ellipse cx="20" cy="30" rx="16" ry="26" fill="#C8905F"></ellipse><path d="M15 6 C28 18 12 40 24 54" stroke="#0E1F1C" stroke-width="4" fill="none" stroke-linecap="round"></path>';
const IP='<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11Z" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/></svg>';
const IB='<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M11 6l-6 6 6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const IPL='<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
const IMI='<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
const IWA='<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3Z" stroke="#FFF6EA" stroke-width="1.5" stroke-linejoin="round"/></svg>';
const IPH='<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.3"/><path d="M3 15l5-5 4 4 3-3 6 6" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><circle cx="16" cy="9" r="1.5" stroke="currentColor" stroke-width="1.3"/></svg>';
const CATS=['Entradas & arepas','Waffles & mangú','Omelettes & benedictos','Healthy & sandwiches','Temporada','Postres','Café caliente','Café frío & frappés','Chocolate, té & matcha','Frozen & jugos','Cócteles & cervezas'];
const CCOL={'Entradas & arepas':'#FFF6EA','Waffles & mangú':'#FF7A45','Omelettes & benedictos':'#C8F0E6','Healthy & sandwiches':'#CFECC2','Temporada':'#FFC9A8','Postres':'#E9C6A8','Café caliente':'#5FE3C8','Café frío & frappés':'#1FA896','Chocolate, té & matcha':'#FFB547','Frozen & jugos':'#F7A8B8','Cócteles & cervezas':'#D4A05A'};
const SUBS={'Entradas & arepas':['Entradas','Arepas'],'Waffles & mangú':['Salados · waffle o mangú','Dulces','Sencillos'],'Omelettes & benedictos':[],'Healthy & sandwiches':['Bowls','Sándwiches & pitas'],'Temporada':['Waffle & French toast','Croissants & toast'],'Postres':[],'Café caliente':['Clásicos','De la casa & saborizados'],'Café frío & frappés':['Filtrados','Fríos','Frappés'],'Chocolate, té & matcha':['Chocolate','Té','Chai','Matcha'],'Frozen & jugos':['Frozen','Jugos naturales'],'Cócteles & cervezas':['Cócteles','Cervezas']};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'RD$ '+Number(n||0).toLocaleString('es-DO');
const today=()=>new Date().toISOString().slice(0,10);
const gidx=i=>{const g=SUBS[i.cat]||[];const k=g.indexOf(i.group||'');return k<0?g.length:k};
const sortItems=a=>a.slice().sort((x,y)=>(CATS.indexOf(x.cat)-CATS.indexOf(y.cat))||(gidx(x)-gidx(y))||((x.order||0)-(y.order||0))||String(x.name).localeCompare(String(y.name),'es'));
const groupBy=list=>{const o=[];list.forEach(i=>{const g=i.group||'';let s=o.find(x=>x.name===g);if(!s){s={name:g,items:[]};o.push(s)}s.items.push(i)});return o};
const optGroups=it=>{const g=[];if(it.priceMangu!=null&&it.priceMangu!=='')g.push({id:'base',name:'Base',choices:[{id:'waffle',label:'Waffle',extra:0},{id:'mangu',label:'Mangú',extra:Number(it.priceMangu)-Number(it.price)}]});(Array.isArray(it.options)?it.options:[]).forEach(x=>g.push(x));return g};
const defSel=it=>{const s={};optGroups(it).forEach(g=>s[g.id]=g.choices[0].id);return s};
const priceOf=(it,sel)=>Number(it.price)+optGroups(it).reduce((a,g)=>a+(g.choices.find(c=>c.id===(sel||{})[g.id])||g.choices[0]).extra,0);
const skipOpt=(g,c)=>(g==='syrup'&&c==='no')||(g==='prote'&&c==='no');
const optsLabel=(it,sel)=>optGroups(it).map(g=>{const c=g.choices.find(x=>x.id===(sel||{})[g.id])||g.choices[0];return skipOpt(g.id,c.id)?'':c.label.replace(/ · \+\d+$/,'')}).filter(Boolean).join(', ');
const isLive=o=>o.active&&!(o.endsOn&&o.endsOn<today());

const params=new URLSearchParams(location.search);
let MODO=['delivery','local','mesa'].includes(params.get('modo'))?params.get('modo'):'delivery';
let sb=null,items=[],offers=[],config={},loaded=false,err=null;
let st={view:'welcome',cat:null,open:null,sel:{},cart:[],mode:'delivery',mesa:'',name:'',address:'',note:'',_f:null};
const app=document.getElementById('app');

function greet(){const h=new Date().getHours();return h<12?'Buenos días.':h<18?'Buenas tardes.':'Buenas noches.'}
function beans(){let h='<div class="beans">';[[6,18,12,2],[18,13,16,7],[31,22,11,5],[44,15,15,10],[56,19,13,3],[67,12,18,13],[78,17,12,8],[89,14,16,6],[38,11,19,15],[72,20,14,11]].forEach(([l,w,d,e])=>h+=`<svg class="bean" viewBox="0 0 40 60" style="left:${l}%;width:${w}px;animation-duration:${d}s;animation-delay:-${e}s">${BEAN}</svg>`);return h+'</div>'}
const avail=()=>sortItems(items.filter(i=>i.available!==false));
const catItems=c=>avail().filter(i=>i.cat===c);
const liveCats=()=>CATS.filter(c=>avail().some(i=>i.cat===c));
const curOffer=()=>offers.filter(isLive).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))[0];
const qtyOf=id=>st.cart.filter(l=>l.id===id).reduce((a,l)=>a+l.qty,0);
const waNum=()=>String((config||{}).whatsapp||'').replace(/[^0-9]/g,'');
const count=()=>st.cart.reduce((a,l)=>a+l.qty,0);
const total=()=>st.cart.reduce((a,l)=>a+l.unit*l.qty,0);
const bdg=b=>b?`<span class="badge" style="background:${['Nuevo','Oferta','Temporada'].includes(b)?'var(--orange)':'var(--mint)'}">${esc(b)}</span>`:'';
const photo=(it,cls)=>{const col=CCOL[it.cat]||'#5FE3C8';return it.photo?`<span class="ph ${cls||''}"><img src="${esc(it.photo)}" alt="${esc(it.name)}" loading="lazy"></span>`:`<span class="ph ${cls||''}" style="background:linear-gradient(145deg,${col},rgba(14,31,28,.5))">${esc((it.name||'?').trim().charAt(0).toUpperCase())}</span>`};
const bigPhoto=it=>{const col=CCOL[it.cat]||'#5FE3C8';return it.photo?`<div class="detph"><img src="${esc(it.photo)}" alt="${esc(it.name)}" loading="lazy"></div>`:`<div class="detph" style="background:linear-gradient(145deg,${col},rgba(14,31,28,.5))" aria-hidden="true">${esc((it.name||'?').trim().charAt(0).toUpperCase())}</div>`};
function addLine(it,sel){const key=it.id+'|'+optsLabel(it,sel);const i=st.cart.findIndex(l=>l.key===key);if(i>=0)st.cart[i]={...st.cart[i],qty:st.cart[i].qty+1};else st.cart.push({key,id:it.id,name:it.name,cat:it.cat,unit:priceOf(it,sel),opts:optsLabel(it,sel),qty:1})}
function waMsg(){const L=[MODO==='mesa'?'*Pedido en el local · Mesa '+(st.mesa||'[mesa]')+'*':'*Pedido · La Baristería*'];st.cart.forEach(l=>L.push(l.qty+'× '+l.name+(l.opts?' ('+l.opts+')':'')+' — '+money(l.unit*l.qty)));L.push('Subtotal: '+money(total()));if(MODO==='delivery'){L.push('Entrega: Delivery'+(st.address?' · '+st.address:''));L.push('Ubicación exacta: la comparto por aquí')}if(MODO==='mesa'){if(st.name)L.push('Nombre: '+st.name)}else L.push('Nombre: '+(st.name||'[nombre]'));if(st.note)L.push('Nota: '+st.note);return L.join('\n')}

function render(){
  if(err){app.innerHTML=`<div class="center"><span class="m">${LOGO}</span><h2>Menú no disponible</h2><p>${esc(err)}</p></div>`;return}
  if(!loaded){app.innerHTML=`<div class="center"><span class="m">${LOGO}</span><p>Cargando el menú…</p></div>`;return}
  if(!items.length){app.innerHTML=`<div class="center"><span class="m">${LOGO}</span><h2>Menú en preparación</h2><p>Vuelve en un momento.</p></div>`;return}
  const v={welcome:vWelcome,home:vHome,cat:vCat,cart:vCart}[st.view]||vHome;
  let html=v();
  if(count()>0&&st.view!=='cart')html+=barHtml();
  app.innerHTML=html;
  const f=app.querySelector('[data-focus]');if(f){const p=f.value.length;f.focus();try{f.setSelectionRange(p,p)}catch(_){}}
}
const barHtml=()=>`<button class="bar" data-a="cart"><span class="bl"><small>${count()===1?'1 artículo':count()+' artículos'}</small><b>${money(total())}</b></span><span class="go">${MODO==='local'?'Ver selección':'Ver pedido'} <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>`;
const hint=()=>MODO==='local'?'Elige lo que quieras y pídeselo a tu mesero.':MODO==='mesa'?'Arma tu pedido y envíalo a la cocina desde tu mesa.':'Elige una categoría y arma tu pedido.';
const tile=c=>{const col=CCOL[c]||'#5FE3C8';return `<button class="tile rise" style="background:${col}" data-a="cat" data-cat="${esc(c)}"><span class="ph">${IPH}</span><span><b>${esc(c)}</b><br><span class="n">${catItems(c).length} opciones</span></span></button>`};

function vHome(){const o=curOffer(),comer=liveCats().filter(c=>CATS.indexOf(c)<6),tomar=liveCats().filter(c=>CATS.indexOf(c)>=6);
  return `<div class="scr">${beans()}<div class="hdr"><div class="logo"><span class="m">${LOGO}</span><b>La Baristería</b></div>${config.maps?`<a class="icon" href="${esc(config.maps)}" target="_blank" rel="noopener" aria-label="Ubicación">${IP}</a>`:`<span class="icon">${IP}</span>`}</div><div><h1 class="title rise">${greet()}</h1><p class="sub rise">${hint()}</p></div>${o?`<button class="offer rise" data-a="offer"><small>${esc(o.discount||'Oferta')}${o.endsOn?' · hasta '+esc(o.endsOn):''}</small><b>${esc(o.title)}</b><small style="letter-spacing:0;text-transform:none;font-size:13px;opacity:.9">${esc(o.text)}</small></button>`:''}${comer.length?`<div class="sechdr"><b>Para comer</b><span>Entradas, waffles, brunch</span></div><div class="grid2">${comer.map(tile).join('')}</div>`:''}${tomar.length?`<div class="sechdr"><b>Para tomar</b><span>Café, té, frozen, cócteles</span></div><div class="grid2">${tomar.map(tile).join('')}</div>`:''}</div>`}
function itemCard(it){const n=qtyOf(it.id),g=optGroups(it),open=st.open===it.id;let right;if(n>0)right=`<span class="step"><button data-a="dec" data-id="${esc(it.id)}" aria-label="Quitar">${IMI}</button><span class="q">${n}</span><button data-a="inc" data-id="${esc(it.id)}" aria-label="Añadir">${IPL}</button></span>`;else if(g.length)right='';else right=`<button class="add" data-a="quick" data-id="${esc(it.id)}" aria-label="Añadir">${IPL}</button>`;let det='';if(open){const sel=st.sel;det=`<div class="det rise">${bigPhoto(it)}${g.map(gr=>`<div class="optg"><span class="lbl">${esc(gr.name)}</span><div class="opts">${gr.choices.map(c=>`<button class="opt ${sel[gr.id]===c.id?'on':''}" data-a="opt" data-g="${esc(gr.id)}" data-c="${esc(c.id)}">${esc(c.label)}</button>`).join('')}</div></div>`).join('')}<button class="cta" data-a="addsel" data-id="${esc(it.id)}">${IPL}<span>Añadir · ${money(priceOf(it,sel))}</span></button></div>`}return `<div class="card glass rise"><div class="itop"><button class="open" data-a="toggle" data-id="${esc(it.id)}">${photo(it)}<span class="info"><b>${esc(it.name)}</b>${it.desc?`<p>${esc(it.desc)}</p>`:''}<span class="pr"><span class="price">${money(it.price)}${it.priceMangu!=null&&it.priceMangu!==''?' / '+money(it.priceMangu):''}</span>${bdg(it.badge)}</span></span></button>${right}</div>${det}</div>`}
function vCat(){const c=st.cat,list=catItems(c);return `<div class="scr">${beans()}<div class="hdr"><button class="icon" data-a="home" aria-label="Volver">${IB}</button><span class="sub" style="letter-spacing:.2em;text-transform:uppercase;font-size:11px">La Baristería</span></div><div class="chips">${liveCats().map(x=>`<button class="chip" style="${x===c?'background:'+CCOL[x]+';color:#0E1F1C;font-weight:500':''}" data-a="cat" data-cat="${esc(x)}">${esc(x)}</button>`).join('')}</div><h1 class="title rise">${esc(c)}</h1>${groupBy(list).map(gp=>(gp.name?`<div class="sec">${esc(gp.name)}</div>`:'')+`<div class="list">${gp.items.map(itemCard).join('')}</div>`).join('')}</div>`}
function vCart(){const lines=st.cart.map(l=>`<div class="cl glass"><span class="ph" style="background:linear-gradient(145deg,${CCOL[l.cat]||'#5FE3C8'},rgba(14,31,28,.5))"></span><span class="ci"><b>${esc(l.name)}</b><span class="o">${esc(l.opts||'Sin extras')}</span><span class="t">${money(l.unit*l.qty)}</span></span><span class="step"><button data-a="ldec" data-k="${esc(l.key)}" aria-label="Quitar">${IMI}</button><span class="q">${l.qty}</span><button data-a="linc" data-k="${esc(l.key)}" aria-label="Añadir">${IPL}</button></span></div>`).join('');
  const del=MODO==='delivery';let form;
  if(MODO==='local')form=`<div class="form glass"><span class="lbl2">Listo para pedir</span><span style="font-family:var(--disp);font-style:italic;font-weight:500;font-size:24px">Muéstrale esta pantalla a tu mesero</span><span class="note">Tu selección queda aquí mientras decides. Usa + y − para cambiar cantidades.</span></div>`;
  else form=`<div class="form glass">${del?`<div class="seg"><button class="${st.mode==='delivery'?'on':''}" data-a="mdel">Delivery</button><button class="${st.mode!=='delivery'?'on':''}" data-a="mpick">Recoger</button></div>`:''}${MODO==='mesa'?`<span class="lbl2">Número de mesa</span><input class="in" inputmode="numeric" placeholder="Ej. 4" value="${esc(st.mesa)}" data-in="mesa" ${st._f==='mesa'?'data-focus':''}>`:''}<span class="lbl2">Tu nombre${MODO==='mesa'?' (opcional)':''}</span><input class="in" placeholder="Ej. María" value="${esc(st.name)}" data-in="name" ${st._f==='name'?'data-focus':''}>${del&&st.mode==='delivery'?`<span class="lbl2">Sector o referencia (opcional)</span><input class="in" placeholder="Ej. Moca centro, cerca del parque" value="${esc(st.address)}" data-in="address" ${st._f==='address'?'data-focus':''}><span class="note">Tu ubicación exacta la compartes en el chat con un toque.</span>`:''}<span class="lbl2">Nota (opcional)</span><input class="in" placeholder="Sin cebolla, poco hielo…" value="${esc(st.note)}" data-in="note" ${st._f==='note'?'data-focus':''}></div>`;
  const send=MODO!=='local',num=waNum(),href='https://wa.me/'+num+'?text='+encodeURIComponent(waMsg());
  return `<div class="scr"><div class="hdr"><button class="icon" data-a="back" aria-label="Seguir">${IB}</button><span class="sub" style="letter-spacing:.2em;text-transform:uppercase;font-size:11px">${count()===1?'1 artículo':count()+' artículos'}</span></div><h1 class="title rise">${MODO==='local'?'Tu selección':'Tu pedido'}</h1>${st.cart.length?`<div class="lines">${lines}</div>`:'<p class="note" style="text-align:center;padding:24px 0">Aún no has añadido nada. Abre una categoría y toca el + de un plato.</p>'}${st.cart.length?form:''}${st.cart.length?`<div class="tot"><div class="r big"><span>Subtotal</span><b>${money(total())}</b></div><div class="r"><span>${MODO==='mesa'?'Servicio':MODO==='local'?'Pago':'Delivery'}</span><span>${MODO==='mesa'?'En tu mesa':MODO==='local'?'Con tu mesero':'Se confirma por WhatsApp'}</span></div></div>`:''}${st.cart.length&&send?(num?`<a class="bigct" href="${href}" target="_blank" rel="noopener"><span>${IWA}</span><span>${MODO==='mesa'?'Enviar pedido a la cocina':'Enviar pedido por WhatsApp'}</span></a>`:`<p class="note" style="text-align:center">Falta configurar el número de WhatsApp.</p>`):''}${st.cart.length&&send?`<div class="prev"><span class="lbl2">Así le llega al negocio</span><div class="bubble">${esc(waMsg())}</div></div>`:''}${st.cart.length&&MODO==='local'?`<button class="cta" data-a="back">Seguir viendo el menú</button>`:''}</div>`}

const find=id=>items.find(i=>i.id===id);
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,id=b.dataset.id,it=id?find(id):null;
  const A={
    menu(){st.view='home';st.cat=null;st.open=null;render()},
    cat(){st.view='cat';st.cat=b.dataset.cat;st.open=null;render()},
    home(){st.view='home';st.cat=null;st.open=null;render()},
    back(){st.view=st.cat?'cat':'home';render()},
    cart(){st._f=null;st.view='cart';render()},
    offer(){const o=curOffer();if(!o)return;const t=o.itemId&&find(o.itemId);st.view='cat';st.cat=t?t.cat:liveCats()[0];st.open=t?o.itemId:null;st.sel=t?defSel(t):{};render()},
    toggle(){if(!it)return;if(st.open===id)st.open=null;else{st.open=id;st.sel=defSel(it)}render()},
    opt(){st.sel={...st.sel,[b.dataset.g]:b.dataset.c};render()},
    quick(){if(it){addLine(it,defSel(it));render()}},
    addsel(){if(it){addLine(it,st.sel);st.open=null;st.view='cat';render()}},
    inc(){if(it){addLine(it,defSel(it));render()}},
    dec(){const r=[...st.cart].reverse().findIndex(l=>l.id===id);if(r<0)return;const i=st.cart.length-1-r;if(st.cart[i].qty>1)st.cart[i]={...st.cart[i],qty:st.cart[i].qty-1};else st.cart.splice(i,1);render()},
    linc(){const l=st.cart.find(x=>x.key===b.dataset.k);if(l){l.qty++;render()}},
    ldec(){const i=st.cart.findIndex(x=>x.key===b.dataset.k);if(i<0)return;if(st.cart[i].qty>1)st.cart[i].qty--;else st.cart.splice(i,1);render()},
    mdel(){st.mode='delivery';st._f=null;render()},
    mpick(){st.mode='recoger';st._f=null;render()}
  };
  A[a]&&A[a]();
});
app.addEventListener('focusin',e=>{const i=e.target.closest('[data-in]');if(i)st._f=i.dataset.in});
app.addEventListener('change',e=>{const i=e.target.closest('[data-in]');if(i)st[i.dataset.in]=i.target.value});

const mapItem=r=>({id:r.id,name:r.name,cat:r.cat,group:r.grp||'',kind:r.kind,price:r.price,priceMangu:r.price_mangu,desc:r.descr||'',badge:r.badge||'',photo:r.photo||'',available:r.available,options:r.options||[],order:r.pos||0});
const mapOffer=r=>({id:r.id,title:r.title,text:r.body||'',discount:r.discount||'',endsOn:r.ends_on||'',itemId:r.item_id||'',active:r.active,createdAt:Date.parse(r.created_at)||0});
async function load(){
  try{
    const [a,b,c]=await Promise.all([
      sb.from('items').select('*'),
      sb.from('offers').select('*'),
      sb.from('config').select('*').eq('id','main').maybeSingle()
    ]);
    if(a.error)throw a.error;
    items=(a.data||[]).map(mapItem);
    offers=(b.data||[]).map(mapOffer);
    config=c.data||{};
    loaded=true;render();
  }catch(e){err='No pudimos cargar el menú. Revisa tu conexión.';render();}
}
(function(){
  const C=window.BARISTERIA||{};
  if(!C.SUPABASE_URL||C.SUPABASE_URL.includes('TU-PROYECTO')||!window.supabase){err='Configura tus claves de Supabase en config.js';render();return;}
  sb=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);
  load();
  try{
    sb.channel('menu-live')
      .on('postgres_changes',{event:'*',schema:'public',table:'items'},load)
      .on('postgres_changes',{event:'*',schema:'public',table:'offers'},load)
      .on('postgres_changes',{event:'*',schema:'public',table:'config'},load)
      .subscribe();
  }catch(_){}
})();
</script>
</body>
</html>
